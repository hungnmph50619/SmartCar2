name: Fix register phone JavaScript once

on:
  push:
    branches:
      - hung-dev

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hung-dev
          fetch-depth: 0

      - name: Fix phone input handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/SmartCar.Web/Views/Account/Register.cshtml')
          text = path.read_text(encoding='utf-8-sig')
          old = r'''oninput="this.value = this.value.replace(/\D/g, \'\').slice(0, 10)"'''
          new = '''oninput="this.value = this.value.replace(/\\D/g, '').slice(0, 10)"'''
          if old not in text:
              raise SystemExit('Phone handler not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - run: git diff --check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SmartCar.sln
      - run: dotnet build SmartCar.sln --configuration Release --no-restore

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SmartCar.Web/Views/Account/Register.cshtml
          git commit -m "Fix registration phone numeric input handler"
          git push origin HEAD:hung-dev
