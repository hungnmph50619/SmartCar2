name: Audit visible KYC wording once

on:
  push:
    branches:
      - hung-dev

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hung-dev
        uses: actions/checkout@v4
        with:
          ref: hung-dev

      - name: Find KYC wording
        shell: bash
        run: |
          echo '=== KYC occurrences in Web/Infrastructure ==='
          grep -RIn --exclude-dir=bin --exclude-dir=obj --exclude='*.map' 'KYC' src/SmartCar.Web src/SmartCar.Infrastructure || true
