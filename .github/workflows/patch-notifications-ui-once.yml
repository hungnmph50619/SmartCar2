name: Patch notifications UI once

on:
  push:
    branches:
      - hung-dev

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hung-dev
          fetch-depth: 0

      - name: Polish notifications UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/SmartCar.Web/Views/Notifications/Index.cshtml')
          text = path.read_text(encoding='utf-8-sig')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Expected block not found: {label}')
              text = text.replace(old, new, 1)

          replace_once(
          '''    var unreadRegularCount = Model.Count(item =>
                  !item.IsRead &&
                  !item.Title.StartsWith("Hồ sơ KYC chờ duyệt|", StringComparison.Ordinal));

              string FriendlyNotificationText''',
          '''    var unreadRegularCount = Model.Count(item =>
                  !item.IsRead &&
                  !item.Title.StartsWith("Hồ sơ KYC chờ duyệt|", StringComparison.Ordinal));
              var pendingWorkCount = Model.Count(item =>
                  !item.IsRead &&
                  item.Title.StartsWith("Hồ sơ KYC chờ duyệt|", StringComparison.Ordinal));
              var hasKycWorkHistory = Model.Any(item =>
                  item.Title.StartsWith("Hồ sơ KYC chờ duyệt|", StringComparison.Ordinal));

              string FriendlyNotificationText''',
          'header counters')

          replace_once(
          '''    .notifications-list {
                  display: flex;
                  flex-direction: column;
                  gap: .75rem;
              }

              .notification-card {
                  position: relative;
                  display: flex;
                  gap: 1rem;
                  padding: 1rem 1.15rem;''',
          '''    .notifications-list {
                  display: flex;
                  flex-direction: column;
                  gap: .65rem;
              }

              .notification-card {
                  position: relative;
                  display: flex;
                  gap: .85rem;
                  padding: .85rem 1rem;''',
          'card spacing')

          replace_once(
          '''    .notification-icon {
                  flex: 0 0 42px;
                  width: 42px;
                  height: 42px;''',
          '''    .notification-icon {
                  flex: 0 0 38px;
                  width: 38px;
                  height: 38px;''',
          'icon size')

          replace_once(
          '''    .notification-message {
                  margin: .35rem 0 0;
                  color: #465166;
                  line-height: 1.5;
              }

              .notification-meta {
                  display: flex;
                  align-items: center;
                  flex-wrap: wrap;
                  gap: .65rem;
                  margin-top: .65rem;''',
          '''    .notification-message {
                  margin: .25rem 0 0;
                  color: #465166;
                  line-height: 1.45;
              }

              .notification-meta {
                  display: flex;
                  align-items: center;
                  flex-wrap: wrap;
                  gap: .55rem;
                  margin-top: .45rem;''',
          'message spacing')

          replace_once(
          '''    .notification-actions {
                  display: flex;
                  align-items: center;
                  gap: .5rem;
                  margin-top: .8rem;
              }''',
          '''    .notification-actions {
                  display: flex;
                  align-items: center;
                  gap: .5rem;
                  margin-top: .6rem;
              }''',
          'action spacing')

          replace_once(
          '''    .notification-status {
                  display: inline-flex;
                  align-items: center;
                  border-radius: 999px;
                  padding: .16rem .5rem;
                  font-size: .72rem;
                  font-weight: 700;
              }''',
          '''    .notification-status {
                  display: inline-flex;
                  align-items: center;
                  min-height: 22px;
                  border-radius: 999px;
                  padding: .18rem .55rem;
                  font-size: .72rem;
                  font-weight: 700;
                  line-height: 1.15;
              }

              .notification-card-handled {
                  background: #fbfcfe;
              }''',
          'badge sizing')

          replace_once(
          '''            <p class="text-muted mb-0">
                          @if (unreadRegularCount > 0)
                          {
                              <span>@unreadRegularCount thông báo chưa đọc.</span>
                          }
                          else
                          {
                              <span>Bạn đã đọc tất cả thông báo.</span>
                          }
                      </p>''',
          '''            <p class="text-muted mb-0">
                          @if (pendingWorkCount > 0 && unreadRegularCount > 0)
                          {
                              <span><strong>@pendingWorkCount</strong> hồ sơ cần xử lý · @unreadRegularCount thông báo chưa đọc.</span>
                          }
                          else if (pendingWorkCount > 0)
                          {
                              <span><strong>@pendingWorkCount</strong> hồ sơ xác minh đang chờ xử lý.</span>
                          }
                          else if (unreadRegularCount > 0)
                          {
                              <span>@unreadRegularCount thông báo chưa đọc.</span>
                          }
                          else
                          {
                              <span>Bạn đã xử lý và đọc hết các thông báo hiện tại.</span>
                          }
                      </p>''',
          'header status copy')

          replace_once(
          '''    @if (User.IsInRole(SmartCar.Domain.Constants.RoleNames.Admin))
              {
                  <div class="alert notifications-admin-note py-2 px-3 mb-3">
                      <strong>Lưu ý:</strong> mục <strong>Hồ sơ xác minh chờ duyệt</strong> là công việc cần xử lý. Mục này chỉ được đóng sau khi bạn duyệt hồ sơ hoặc yêu cầu khách hàng cập nhật.
                  </div>
              }''',
          '''    @if (User.IsInRole(SmartCar.Domain.Constants.RoleNames.Admin) && hasKycWorkHistory)
              {
                  <div class="alert notifications-admin-note py-2 px-3 mb-3">
                      <strong>Hồ sơ chờ duyệt</strong> là công việc quản trị; trạng thái chỉ chuyển sang <strong>Đã xử lý</strong> sau khi bạn duyệt hoặc yêu cầu khách hàng cập nhật.
                  </div>
              }''',
          'admin note')

          replace_once(
          '''            var toneClass = isKycAction
                              ? "notification-tone-work"
                              : isNeedsUpdate
                                  ? "notification-tone-warning"
                                  : isApproved
                                      ? "notification-tone-success"
                                      : "notification-tone-info";
                          var iconText = isKycAction || isNeedsUpdate
                              ? "!"
                              : isApproved
                                  ? "✓"
                                  : "i";
                          var statusText = isKycAction
                              ? (item.IsRead ? "Đã xử lý" : "Cần xử lý")
                              : isNeedsUpdate
                                  ? "Cần cập nhật"
                                  : isApproved
                                      ? "Đã duyệt"
                                      : (!item.IsRead ? "Mới" : string.Empty);
                          var statusClass = isKycAction || isNeedsUpdate
                              ? "notification-status-warning"
                              : isApproved
                                  ? "notification-status-success"
                                  : "notification-status-info";

                          <article class="notification-card @toneClass @(item.IsRead ? string.Empty : "notification-card-unread")">''',
          '''            var toneClass = isKycAction
                              ? (item.IsRead ? "notification-tone-success" : "notification-tone-work")
                              : isNeedsUpdate
                                  ? "notification-tone-warning"
                                  : isApproved
                                      ? "notification-tone-success"
                                      : "notification-tone-info";
                          var iconText = isKycAction
                              ? (item.IsRead ? "✓" : "!")
                              : isNeedsUpdate
                                  ? "!"
                                  : isApproved
                                      ? "✓"
                                      : "i";
                          var statusText = isKycAction
                              ? (item.IsRead ? "Đã xử lý" : "Cần xử lý")
                              : isNeedsUpdate
                                  ? "Cần cập nhật"
                                  : isApproved
                                      ? "Đã duyệt"
                                      : (!item.IsRead ? "Mới" : string.Empty);
                          var statusClass = isKycAction
                              ? (item.IsRead ? "notification-status-success" : "notification-status-warning")
                              : isNeedsUpdate
                                  ? "notification-status-warning"
                                  : isApproved
                                      ? "notification-status-success"
                                      : "notification-status-info";

                          <article class="notification-card @toneClass @(item.IsRead ? string.Empty : "notification-card-unread") @(isKycAction && item.IsRead ? "notification-card-handled" : string.Empty)">''',
          'work item colors')

          replace_once(
          '''                    <div class="notification-actions">
                                  @if (isKycAction && !item.IsRead)
                                  {
                                      <form asp-action="OpenKyc" method="post">
                                          <input type="hidden" name="id" value="@item.NotificationId" />
                                          <input type="hidden" name="customerId" value="@kycCustomerId" />
                                          <button class="btn btn-sm btn-primary stretched-link" type="submit">Mở hồ sơ để xử lý →</button>
                                      </form>
                                  }
                                  else if (opensProfileDocuments)
                                  {
                                      <form asp-action="OpenProfileDocuments" method="post">
                                          <input type="hidden" name="id" value="@item.NotificationId" />
                                          <button class="btn btn-sm @(isNeedsUpdate ? "btn-primary" : "btn-outline-primary") stretched-link" type="submit">
                                              @(isNeedsUpdate ? "Cập nhật hồ sơ →" : "Xem hồ sơ →")
                                          </button>
                                      </form>
                                  }
                                  else if (!item.IsRead && !isKycAction)
                                  {
                                      <form asp-action="MarkRead" method="post">
                                          <input type="hidden" name="id" value="@item.NotificationId" />
                                          <button class="btn btn-sm btn-link text-decoration-none px-0" type="submit">Đánh dấu đã đọc</button>
                                      </form>
                                  }
                              </div>''',
          '''                    @if (isKycAction || opensProfileDocuments || (!item.IsRead && !isKycAction))
                              {
                                  <div class="notification-actions">
                                      @if (isKycAction && !item.IsRead)
                                      {
                                          <form asp-action="OpenKyc" method="post">
                                              <input type="hidden" name="id" value="@item.NotificationId" />
                                              <input type="hidden" name="customerId" value="@kycCustomerId" />
                                              <button class="btn btn-sm btn-primary stretched-link" type="submit">Xử lý hồ sơ →</button>
                                          </form>
                                      }
                                      else if (isKycAction && item.IsRead)
                                      {
                                          <a class="btn btn-sm btn-outline-secondary stretched-link"
                                             asp-controller="AdminCustomers"
                                             asp-action="Details"
                                             asp-route-id="@kycCustomerId"
                                             asp-route-tab="documents">
                                              Xem hồ sơ giấy tờ →
                                          </a>
                                      }
                                      else if (opensProfileDocuments)
                                      {
                                          <form asp-action="OpenProfileDocuments" method="post">
                                              <input type="hidden" name="id" value="@item.NotificationId" />
                                              <button class="btn btn-sm @(isNeedsUpdate ? "btn-primary" : "btn-outline-primary") stretched-link" type="submit">
                                                  @(isNeedsUpdate ? "Cập nhật hồ sơ →" : "Xem hồ sơ →")
                                              </button>
                                          </form>
                                      }
                                      else if (!item.IsRead && !isKycAction)
                                      {
                                          <form asp-action="MarkRead" method="post">
                                              <input type="hidden" name="id" value="@item.NotificationId" />
                                              <button class="btn btn-sm btn-link text-decoration-none px-0" type="submit">Đánh dấu đã đọc</button>
                                          </form>
                                      }
                                  </div>
                              }''',
          'actions')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check diff
        run: git diff --check && git diff -- src/SmartCar.Web/Views/Notifications/Index.cshtml

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SmartCar.sln

      - name: Build
        run: dotnet build SmartCar.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SmartCar.Web/Views/Notifications/Index.cshtml
          git commit -m "Polish admin notification UX"
          git push origin HEAD:hung-dev
