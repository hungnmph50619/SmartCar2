name: Patch notifications UI once

on:
  push:
    branches:
      - hung-dev

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hung-dev
          fetch-depth: 0

      - name: Polish notifications UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/SmartCar.Web/Views/Notifications/Index.cshtml')
          text = path.read_text(encoding='utf-8-sig')

          def replace_required(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Expected text not found: {label}')
              text = text.replace(old, new, 1)

          # Header counters: distinguish work items from normal unread notifications.
          marker = '''    var unreadRegularCount = Model.Count(item =>
              !item.IsRead &&
              !item.Title.StartsWith("Hồ sơ KYC chờ duyệt|", StringComparison.Ordinal));
'''
          replace_required(marker, marker + '''    var pendingWorkCount = Model.Count(item =>
              !item.IsRead &&
              item.Title.StartsWith("Hồ sơ KYC chờ duyệt|", StringComparison.Ordinal));
          var hasKycWorkHistory = Model.Any(item =>
              item.Title.StartsWith("Hồ sơ KYC chờ duyệt|", StringComparison.Ordinal));
''', 'notification counters')

          # Compact card rhythm.
          replace_required('gap: .75rem;\n    }\n\n    .notification-card {', 'gap: .65rem;\n    }\n\n    .notification-card {', 'list gap')
          replace_required('gap: 1rem;\n        padding: 1rem 1.15rem;', 'gap: .85rem;\n        padding: .85rem 1rem;', 'card spacing')
          replace_required('flex: 0 0 42px;\n        width: 42px;\n        height: 42px;', 'flex: 0 0 38px;\n        width: 38px;\n        height: 38px;', 'icon size')
          replace_required('margin: .35rem 0 0;\n        color: #465166;\n        line-height: 1.5;', 'margin: .25rem 0 0;\n        color: #465166;\n        line-height: 1.45;', 'message rhythm')
          replace_required('gap: .65rem;\n        margin-top: .65rem;', 'gap: .55rem;\n        margin-top: .45rem;', 'meta rhythm')
          replace_required('margin-top: .8rem;\n    }\n\n    .notification-actions form', 'margin-top: .6rem;\n    }\n\n    .notification-actions form', 'action rhythm')
          replace_required('border-radius: 999px;\n        padding: .16rem .5rem;\n        font-size: .72rem;\n        font-weight: 700;\n    }', 'min-height: 22px;\n        border-radius: 999px;\n        padding: .18rem .55rem;\n        font-size: .72rem;\n        font-weight: 700;\n        line-height: 1.15;\n    }\n\n    .notification-card-handled {\n        background: #fbfcfe;\n    }', 'status badge')

          # Header copy.
          old_header = '''            <p class="text-muted mb-0">
                  @if (unreadRegularCount > 0)
                  {
                      <span>@unreadRegularCount thông báo chưa đọc.</span>
                  }
                  else
                  {
                      <span>Bạn đã đọc tất cả thông báo.</span>
                  }
              </p>'''
          new_header = '''            <p class="text-muted mb-0">
                  @if (pendingWorkCount > 0 && unreadRegularCount > 0)
                  {
                      <span><strong>@pendingWorkCount</strong> hồ sơ cần xử lý · @unreadRegularCount thông báo chưa đọc.</span>
                  }
                  else if (pendingWorkCount > 0)
                  {
                      <span><strong>@pendingWorkCount</strong> hồ sơ xác minh đang chờ xử lý.</span>
                  }
                  else if (unreadRegularCount > 0)
                  {
                      <span>@unreadRegularCount thông báo chưa đọc.</span>
                  }
                  else
                  {
                      <span>Bạn đã xử lý và đọc hết các thông báo hiện tại.</span>
                  }
              </p>'''
          replace_required(old_header, new_header, 'header copy')

          replace_required(
              '@if (User.IsInRole(SmartCar.Domain.Constants.RoleNames.Admin))\n    {\n        <div class="alert notifications-admin-note py-2 px-3 mb-3">\n            <strong>Lưu ý:</strong> mục <strong>Hồ sơ xác minh chờ duyệt</strong> là công việc cần xử lý. Mục này chỉ được đóng sau khi bạn duyệt hồ sơ hoặc yêu cầu khách hàng cập nhật.\n        </div>\n    }',
              '@if (User.IsInRole(SmartCar.Domain.Constants.RoleNames.Admin) && hasKycWorkHistory)\n    {\n        <div class="alert notifications-admin-note py-2 px-3 mb-3">\n            <strong>Hồ sơ chờ duyệt</strong> là công việc quản trị; trạng thái chỉ chuyển sang <strong>Đã xử lý</strong> sau khi bạn duyệt hoặc yêu cầu khách hàng cập nhật.\n        </div>\n    }',
              'admin note')

          # Work-item status should visually become successful once handled.
          replace_required('var toneClass = isKycAction\n                ? "notification-tone-work"', 'var toneClass = isKycAction\n                ? (item.IsRead ? "notification-tone-success" : "notification-tone-work")', 'tone')
          replace_required('var iconText = isKycAction || isNeedsUpdate\n                ? "!"', 'var iconText = isKycAction\n                ? (item.IsRead ? "✓" : "!")\n                : isNeedsUpdate\n                    ? "!"', 'icon')
          replace_required('var statusClass = isKycAction || isNeedsUpdate\n                ? "notification-status-warning"', 'var statusClass = isKycAction\n                ? (item.IsRead ? "notification-status-success" : "notification-status-warning")\n                : isNeedsUpdate\n                    ? "notification-status-warning"', 'status class')
          replace_required('<article class="notification-card @toneClass @(item.IsRead ? string.Empty : "notification-card-unread")">', '<article class="notification-card @toneClass @(item.IsRead ? string.Empty : "notification-card-unread") @(isKycAction && item.IsRead ? "notification-card-handled" : string.Empty)">', 'handled card')
          replace_required('Mở hồ sơ để xử lý →', 'Xử lý hồ sơ →', 'pending CTA')

          # Handled work items get a read-only profile CTA instead of looking dead.
          needle = '''                        }
                      else if (opensProfileDocuments)
                      {'''
          replacement = '''                        }
                      else if (isKycAction && item.IsRead)
                      {
                          <a class="btn btn-sm btn-outline-secondary stretched-link"
                             asp-controller="AdminCustomers"
                             asp-action="Details"
                             asp-route-id="@kycCustomerId"
                             asp-route-tab="documents">
                              Xem hồ sơ giấy tờ →
                          </a>
                      }
                      else if (opensProfileDocuments)
                      {'''
          replace_required(needle, replacement, 'handled CTA')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Check diff
        run: git diff --check && git diff -- src/SmartCar.Web/Views/Notifications/Index.cshtml

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SmartCar.sln

      - name: Build
        run: dotnet build SmartCar.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SmartCar.Web/Views/Notifications/Index.cshtml
          git commit -m "Polish admin notification UX"
          git push origin HEAD:hung-dev
