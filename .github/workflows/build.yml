name: Build SmartCar

on:
  push:
    branches:
      - master
      - agent/**
      - hoangquangtruong_Staff
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "SmartCar_CI_2026!"
        ports:
          - 1433:1433
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SmartCarCiDb;User Id=sa;Password=SmartCar_CI_2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SmartCar.sln

      - name: Build solution
        run: dotnet build SmartCar.sln --configuration Release --no-restore

      - name: Run unit tests
        if: hashFiles('tests/SmartCar.Tests/SmartCar.Tests.csproj') != ''
        run: dotnet test tests/SmartCar.Tests/SmartCar.Tests.csproj --configuration Release --no-build

      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..45}; do
            if (echo > /dev/tcp/localhost/1433) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready"
          exit 1

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 8.0.16

      - name: Apply migrations to clean database
        run: |
          dotnet ef database update \
            --project src/SmartCar.Infrastructure \
            --startup-project src/SmartCar.Web \
            --no-build

      - name: Check pending model changes
        id: pending_model
        continue-on-error: true
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/SmartCar.Infrastructure \
            --startup-project src/SmartCar.Web \
            --no-build

      # Tạm tạo snapshot chẩn đoán khi model/snapshot bị lệch. Chỉ upload artifact,
      # tuyệt đối không commit migration chẩn đoán vào repo.
      - name: Generate diagnostic EF snapshot
        if: steps.pending_model.outcome == 'failure'
        run: |
          dotnet ef migrations add __SnapshotSyncDiagnostic \
            --project src/SmartCar.Infrastructure \
            --startup-project src/SmartCar.Web \
            --output-dir Persistence/Migrations/__SnapshotDiagnostic \
            --no-build

      - name: Upload diagnostic model snapshot
        if: steps.pending_model.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generated-model-snapshot
          path: src/SmartCar.Infrastructure/Persistence/Migrations/ApplicationDbContextModelSnapshot.cs
          if-no-files-found: error
          retention-days: 1

      - name: Fail on pending model changes
        if: steps.pending_model.outcome == 'failure'
        run: |
          echo "EF Core model differs from ApplicationDbContextModelSnapshot.cs."
          exit 1
