name: Build SmartCar

on:
  push:
    branches:
      - master
      - agent/**
  pull_request:
    branches:
      - master
      - agent/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SmartCar.sln

      - name: Build solution
        run: dotnet build SmartCar.sln --configuration Release --no-restore
