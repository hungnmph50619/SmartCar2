name: Build SmartCar

on:
  push:
    branches:
      - master
      - agent/**
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  sync-snapshot:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/giai-doan-3-quan-ly-nang-cao'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check synchronized migration
        id: snapshot
        shell: bash
        run: |
          if find src/SmartCar.Infrastructure/Persistence/Migrations -maxdepth 1 -name '*_Phase3SnapshotSync.cs' | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET 8
        if: steps.snapshot.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        if: steps.snapshot.outputs.exists == 'false'
        run: dotnet restore SmartCar.sln

      - name: Install EF tool
        if: steps.snapshot.outputs.exists == 'false'
        run: dotnet tool install --global dotnet-ef --version 8.0.16

      - name: Generate synchronized snapshot
        if: steps.snapshot.outputs.exists == 'false'
        shell: bash
        run: |
          dotnet ef migrations add Phase3SnapshotSync \
            --project src/SmartCar.Infrastructure \
            --startup-project src/SmartCar.Web \
            --output-dir Persistence/Migrations

          migration_file=$(find src/SmartCar.Infrastructure/Persistence/Migrations \
            -maxdepth 1 -name '*_Phase3SnapshotSync.cs' ! -name '*.Designer.cs' | head -n 1)

          python3 - "$migration_file" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          up_start = text.index("    protected override void Up")
          replacement = '''    protected override void Up(MigrationBuilder migrationBuilder)
              {
              }

              protected override void Down(MigrationBuilder migrationBuilder)
              {
              }
          }
          '''
          path.write_text(text[:up_start] + replacement, encoding="utf-8")
          PY

      - name: Commit synchronized snapshot
        if: steps.snapshot.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SmartCar.Infrastructure/Persistence/Migrations
          git commit -m "chore: sync EF model snapshot"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "SmartCar_CI_2026!"
        ports:
          - 1433:1433
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SmartCarCiDb;User Id=sa;Password=SmartCar_CI_2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SmartCar.sln

      - name: Build solution
        run: dotnet build SmartCar.sln --configuration Release --no-restore

      - name: Run unit tests
        if: hashFiles('tests/SmartCar.Tests/SmartCar.Tests.csproj') != ''
        run: dotnet test tests/SmartCar.Tests/SmartCar.Tests.csproj --configuration Release --no-build

      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..45}; do
            if (echo > /dev/tcp/localhost/1433) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready"
          exit 1

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 8.0.16

      - name: Apply migrations to clean database
        run: |
          dotnet ef database update \
            --project src/SmartCar.Infrastructure \
            --startup-project src/SmartCar.Web

      - name: Check pending model changes
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/SmartCar.Infrastructure \
            --startup-project src/SmartCar.Web
