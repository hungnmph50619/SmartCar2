          path.write_text(text, encoding='utf-8')
          PY

      - name: Check diff
        run: git diff --check

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SmartCar.sln

      - name: Build
        run: dotnet build SmartCar.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SmartCar.sln --configuration Release --no-build

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SmartCar.Web/Views/Profile/_DocumentsTab.cshtml
          git commit -m "Improve document verification form UX"
          git push origin HEAD:hung-dev
