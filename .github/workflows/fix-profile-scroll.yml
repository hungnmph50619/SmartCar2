name: Fix profile validation scroll

on:
  push:
    branches:
      - hung-dev
    paths:
      - .github/workflows/fix-profile-scroll.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hung-dev
        uses: actions/checkout@v4
        with:
          ref: hung-dev
          fetch-depth: 0

      - name: Patch non-interactive validity check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/SmartCar.Web/wwwroot/js/profile-interactions.js')
          text = path.read_text(encoding='utf-8')
          old = "const ready = requiredControls.every(control => control.checkValidity());"
          new = "const ready = requiredControls.every(control => control.validity.valid);"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -F "const ready = requiredControls.every(control => control.validity.valid);" src/SmartCar.Web/wwwroot/js/profile-interactions.js
          if grep -F "const ready = requiredControls.every(control => control.checkValidity());" src/SmartCar.Web/wwwroot/js/profile-interactions.js; then
            echo "Old interactive validity check still exists"
            exit 1
          fi

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SmartCar.Web/wwwroot/js/profile-interactions.js
          git commit -m "Fix profile form jumping during input"
          git push origin HEAD:hung-dev
