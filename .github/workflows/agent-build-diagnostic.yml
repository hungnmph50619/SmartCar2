name: Agent Build Diagnostic

on:
  push:
    branches:
      - agent/**

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SmartCar.sln
      - name: Build with captured log
        shell: bash
        run: |
          set +e
          dotnet build SmartCar.sln --configuration Release --no-restore 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "$code" > build.exitcode
          exit 0
      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: agent-build-log
          path: |
            build.log
            build.exitcode
          retention-days: 1
      - name: Fail when build failed
        shell: bash
        run: |
          code=$(cat build.exitcode)
          if [ "$code" != "0" ]; then
            echo "Build failed with exit code $code"
            exit "$code"
          fi
