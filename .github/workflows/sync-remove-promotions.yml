name: Sync promotion removal migration

on:
  push:
    branches:
      - hung-dev

permissions:
  contents: write

jobs:
  sync-migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hung-dev
        uses: actions/checkout@v4
        with:
          ref: hung-dev
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SmartCar.sln

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 8.0.16

      - name: Generate promotion removal migration and sync snapshot
        run: |
          dotnet ef migrations add RemovePromotions \
            --project src/SmartCar.Infrastructure \
            --startup-project src/SmartCar.Web

      - name: Commit generated EF files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SmartCar.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No migration changes generated."
            exit 0
          fi
          git commit -m "Generate EF migration for promotion removal"
          git push origin HEAD:hung-dev
