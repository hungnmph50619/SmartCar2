                booking.TotalAmount,
                booking.AdditionalAmount,
                booking.DepositAmount,
                booking.Payments.Select(item =>
                    new UpfrontPaymentEntry(item.Type, item.Amount, item.Status)));
            var remainingDeposit = depositAssessment.MissingDepositAmount;

            var orphanedAwaitingDeposit = booking.Payments.Any(item =>
                item.Type == PaymentType.Deposit &&
                item.Status == PaymentStatus.AwaitingConfirmation);
            if (orphanedAwaitingDeposit)
            {
                return OperationResult.Failure(
                    "Đơn đang có giao dịch cọc chờ đối soát. Vui lòng xử lý giao dịch cũ trước khi tạo lần thanh toán mới.");
            }

            var pendingDeposits = booking.Payments
                .Where(item =>
                    item.Type == PaymentType.Deposit &&
                    item.Status == PaymentStatus.Pending)
                .OrderBy(item => item.PaymentId)
                .ToList();

            if (remainingDeposit > 0m)
            {
                bundledDeposit = pendingDeposits.FirstOrDefault();
                foreach (var duplicate in pendingDeposits.Skip(1))
                {
                    duplicate.Status = PaymentStatus.Failed;
                    duplicate.Method = PaymentMethods.NotSelected;
                    duplicate.PaidAt = null;
                    duplicate.TransactionCode = null;
                }

                if (bundledDeposit is null)
