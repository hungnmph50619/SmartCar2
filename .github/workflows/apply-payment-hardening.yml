            if (payment.Amount != requiredRentalAmount)
            {
                return OperationResult.Failure(
                    $"Số tiền thuê/phí giao chờ xác nhận ({payment.Amount:N0} đồng) không khớp số phải thu hiện tại ({requiredRentalAmount:N0} đồng). " +
                    "Không xác nhận để tránh ghi Paid sai số tiền.");
            }

            var currentAssessment = UpfrontPaymentRules.Assess(
