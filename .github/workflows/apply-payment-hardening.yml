                booking.AdditionalAmount,
                booking.DepositAmount,
                booking.Payments.Select(item =>
                    new UpfrontPaymentEntry(item.Type, item.Amount, item.Status)));
            var awaitingDeposits = booking.Payments
                .Where(item =>
                    item.Type == PaymentType.Deposit &&
                    item.Status == PaymentStatus.AwaitingConfirmation)
                .OrderBy(item => item.PaymentId)
                .ToList();

            if (currentAssessment.MissingDepositAmount > 0m)
            {
                if (awaitingDeposits.Count != 1)
                {
                    return OperationResult.Failure(
                        "Dữ liệu cọc chờ đối soát không nhất quán. Phải có đúng một khoản cọc đi kèm trước khi xác nhận tiền thuê.");
                }

                expectedBundledDeposit = awaitingDeposits[0];
                if (expectedBundledDeposit.Amount != currentAssessment.MissingDepositAmount)
                {
                    return OperationResult.Failure(
                        $"Khoản cọc chờ xác nhận ({expectedBundledDeposit.Amount:N0} đồng) không khớp phần cọc còn thiếu ({currentAssessment.MissingDepositAmount:N0} đồng).");
                }
            }
            else if (awaitingDeposits.Count > 0)
            {
                return OperationResult.Failure(
                    "Đơn đã đủ cọc nhưng vẫn còn giao dịch cọc chờ xác nhận. Vui lòng xử lý dữ liệu trùng trước khi tiếp tục.");
            }

            var projectedSettlement = UpfrontPaymentRules.Assess(
                booking.RentalAmount,
                booking.TotalAmount,
                booking.AdditionalAmount,
                booking.DepositAmount,
                booking.Payments.Select(item => new UpfrontPaymentEntry(
                    item.Type,
