                        : item.Status)));

            if (!projectedSettlement.IsSettled)
            {
                return OperationResult.Failure(
                    $"Sau khi xác nhận giao dịch vẫn còn thiếu {projectedSettlement.MissingRentalAmount:N0} đồng tiền thuê/phí giao " +
