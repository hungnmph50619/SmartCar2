name: Agent Generate EF Migration

on:
  push:
    branches:
      - agent/staff-ux-hardening

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "SmartCar_CI_2026!"
        ports:
          - 1433:1433
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SmartCarMigrationGen;User Id=sa;Password=SmartCar_CI_2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SmartCar.sln
      - name: Build
        run: dotnet build SmartCar.sln --configuration Release --no-restore
      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..45}; do
            if (echo > /dev/tcp/localhost/1433) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready"
          exit 1
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 8.0.16
      - name: Apply existing migrations
        run: |
          dotnet ef database update \
            --project src/SmartCar.Infrastructure \
            --startup-project src/SmartCar.Web \
            --configuration Release \
            --no-build
      - name: Generate hardening migration
        run: |
          dotnet ef migrations add UxIdentityHoldHardening \
            --project src/SmartCar.Infrastructure \
            --startup-project src/SmartCar.Web \
            --output-dir Persistence/Migrations \
            --configuration Release \
            --no-build
      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: ux-identity-hold-migration
          path: |
            src/SmartCar.Infrastructure/Persistence/Migrations/*UxIdentityHoldHardening*.cs
            src/SmartCar.Infrastructure/Persistence/Migrations/ApplicationDbContextModelSnapshot.cs
          if-no-files-found: error
          retention-days: 1
