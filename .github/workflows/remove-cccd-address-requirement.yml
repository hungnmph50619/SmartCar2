name: Remove CCCD address requirement

on:
  push:
    branches:
      - hung-dev
    paths:
      - .github/workflows/remove-cccd-address-requirement.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "SmartCar_CI_2026!"
        ports:
          - 1433:1433
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SmartCarCiDb;User Id=sa;Password=SmartCar_CI_2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
    steps:
      - name: Checkout hung-dev
        uses: actions/checkout@v4
        with:
          ref: hung-dev
          fetch-depth: 0

      - name: Remove residence requirement
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found for {label} in {path}')
              text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          service = 'src/SmartCar.Infrastructure/Services/DocumentService.cs'
          replace_exact(
              service,
              '            string.IsNullOrWhiteSpace(request.Gender) ||\n            string.IsNullOrWhiteSpace(request.PermanentAddress) ||\n            string.IsNullOrWhiteSpace(request.FrontImagePath) ||',
              '            string.IsNullOrWhiteSpace(request.Gender) ||\n            string.IsNullOrWhiteSpace(request.FrontImagePath) ||',
              'CitizenId validation')
          replace_exact(
              service,
              '                metadata.DateOfBirth.HasValue &&\n                !string.IsNullOrWhiteSpace(metadata.PermanentAddress),',
              '                metadata.DateOfBirth.HasValue,',
              'CitizenId HasRequiredData')
          replace_exact(
              service,
              '                request.PermanentAddress.Trim(),\n                null,',
              '                null,\n                null,',
              'CitizenId metadata address')
          replace_exact(
              service,
              '            "Gửi hồ sơ CCCD gồm thông tin khai báo, địa chỉ thường trú và hai ảnh để xác minh.",',
              '            "Gửi hồ sơ CCCD gồm thông tin khai báo và hai ảnh để xác minh.",',
              'CitizenId audit text')

          package_controller = 'src/SmartCar.Web/Controllers/KycPackageController.cs'
          replace_exact(
              package_controller,
              '                    citizen.PermanentAddress.Trim(),\n                    null,',
              '                    null,\n                    null,',
              'initial package address metadata')

          review = 'src/SmartCar.Web/Views/AdminKyc/Review.cshtml'
          replace_exact(
              review,
              '                        <div class="kyc-data-item is-wide"><span>Nơi cư trú</span><strong>@(citizenFront.PermanentAddress ?? "Chưa cập nhật")</strong></div>\n',
              '',
              'Admin residence display')
          replace_exact(
              review,
              '                            <label><input class="form-check-input" type="checkbox" required /> CCCD: họ tên, số CCCD, ngày sinh, hạn sử dụng và nơi cư trú khớp với ảnh.</label>',
              '                            <label><input class="form-check-input" type="checkbox" required /> CCCD: họ tên, số CCCD, ngày sinh và hạn sử dụng khớp với ảnh.</label>',
              'Admin checklist residence text')

      - name: Verify residence no longer blocks review
        shell: bash
        run: |
          ! grep -q 'string.IsNullOrWhiteSpace(request.PermanentAddress)' src/SmartCar.Infrastructure/Services/DocumentService.cs
          ! grep -q '!string.IsNullOrWhiteSpace(metadata.PermanentAddress)' src/SmartCar.Infrastructure/Services/DocumentService.cs
          ! grep -q '<span>Nơi cư trú</span>' src/SmartCar.Web/Views/AdminKyc/Review.cshtml
          grep -q 'CCCD: họ tên, số CCCD, ngày sinh và hạn sử dụng khớp với ảnh.' src/SmartCar.Web/Views/AdminKyc/Review.cshtml

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SmartCar.sln

      - name: Build
        run: dotnet build SmartCar.sln --configuration Release --no-restore

      - name: Test
        if: hashFiles('tests/SmartCar.Tests/SmartCar.Tests.csproj') != ''
        run: dotnet test tests/SmartCar.Tests/SmartCar.Tests.csproj --configuration Release --no-build

      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..45}; do
            if (echo > /dev/tcp/localhost/1433) >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 8.0.16

      - name: Validate clean migrations
        run: |
          dotnet ef database update --project src/SmartCar.Infrastructure --startup-project src/SmartCar.Web
          dotnet ef migrations has-pending-model-changes --project src/SmartCar.Infrastructure --startup-project src/SmartCar.Web

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "hungnmph50619"
          git config user.email "hungnmph50619@gmail.com"
          git add src/SmartCar.Infrastructure/Services/DocumentService.cs \
                  src/SmartCar.Web/Controllers/KycPackageController.cs \
                  src/SmartCar.Web/Views/AdminKyc/Review.cshtml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Remove redundant CCCD residence requirement"
          git push origin HEAD:hung-dev
