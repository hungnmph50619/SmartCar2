name: Limit register phone input once

on:
  push:
    branches:
      - hung-dev

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hung-dev
          fetch-depth: 0

      - name: Limit registration phone to 10 digits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/SmartCar.Web/Views/Account/Register.cshtml')
          text = path.read_text(encoding='utf-8-sig')

          pattern = re.compile(
              r'(<input\s+asp-for="PhoneNumber"[\s\S]*?placeholder="0912345678"[\s\S]*?)inputmode="tel"([\s\S]*?)autocomplete="tel"\s*/>',
              re.MULTILINE,
          )

          replacement = (
              r'\1inputmode="numeric"\2'
              r'maxlength="10"\n'
              r'                                       pattern="[0-9]{10}"\n'
              r'                                       oninput="this.value = this.value.replace(/\\D/g, \'\').slice(0, 10)"\n'
              r'                                       autocomplete="tel" />'
          )

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one phone input match, found {count}')

          validation = '<span asp-validation-for="PhoneNumber" class="text-danger small"></span>'
          helper = '<div class="form-text">Nhập 10 chữ số, bắt đầu bằng 0.</div>\n                                '
          if helper.strip() not in updated:
              updated = updated.replace(validation, helper + validation, 1)

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Check diff
        run: git diff --check

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SmartCar.sln

      - name: Build
        run: dotnet build SmartCar.sln --configuration Release --no-restore

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SmartCar.Web/Views/Account/Register.cshtml
          git commit -m "Limit registration phone to 10 digits"
          git push origin HEAD:hung-dev
